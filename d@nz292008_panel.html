<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* Fix kolum terkeluar kanan (mobile) */
*{ box-sizing:border-box; }
.card{ overflow:hidden; }
input, button, .row, .result{ max-width:100%; }

body{
  margin:0;
  font-family:Rajdhani, sans-serif;
  min-height:100vh;
  color:#e6f0ff;
  background:
    radial-gradient(circle at 20% 10%, rgba(0,229,255,.20), transparent 50%),
    radial-gradient(circle at 85% 25%, rgba(124,255,178,.14), transparent 55%),
    linear-gradient(180deg,#0b1530,#070b14);
  padding:20px;
}

.wrap{max-width:700px;margin:auto}

.title{
  font-family:Orbitron;
  font-size:20px;
  margin-bottom:15px;
}

.card{
  background:rgba(10,18,34,.9);
  border:1px solid rgba(0,229,255,.3);
  border-radius:18px;
  padding:20px;
  box-shadow:0 20px 45px rgba(0,0,0,.6);
}

label{font-size:12px;color:#9fb6d0}

input{
  width:100%;
  padding:12px;
  margin-top:5px;
  margin-bottom:15px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.3);
  color:#fff;
  font-weight:700;
}

button{
  padding:12px;
  border-radius:14px;
  border:0;
  font-weight:900;
  cursor:pointer;
  flex:1;
}

.btn-primary{
  background:linear-gradient(90deg,#00e5ff,#7cffb2);
  color:#032a2f;
}

.btn-danger{
  background:rgba(255,77,109,.15);
  border:1px solid rgba(255,77,109,.4);
  color:#ffd5dd;
}

.btn-secondary{
  background:rgba(255,255,255,.1);
  color:#fff;
}

.row{display:flex;gap:10px;flex-wrap:wrap}

.result{
  margin-top:15px;
  padding:12px;
  border-radius:14px;
  background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.15);
  font-weight:800;
}

.lock{
  margin-top:10px;
  padding:12px;
  border-radius:14px;
  background:rgba(255,77,109,.1);
  border:1px solid rgba(255,77,109,.4);
  display:none;
  font-weight:800;
}

/* ===== Admin Key Modal ===== */
.keymodal{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.55);
  backdrop-filter: blur(8px);
  z-index:9999;
}

.keybox{
  width:min(520px, 92vw);
  border-radius:18px;
  padding:16px;
  background:rgba(10,20,28,.92);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 12px 40px rgba(0,0,0,.55);
}

.keytitle{
  font-weight:900;
  font-size:18px;
  margin-bottom:6px;
}

.keysub{
  opacity:.85;
  font-weight:700;
  font-size:13px;
  margin-bottom:12px;
}

.keyinput{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);
  color:#fff;
  outline:none;
  font-weight:800;
}

.keyrow{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.keyerr{
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  background:rgba(255,77,109,.12);
  border:1px solid rgba(255,77,109,.45);
  color:#ffd5dd;
  font-weight:800;
  font-size:13px;
}
</style>
</head>
<body>

<div class="wrap">
  <div class="title">Admin Wallet Panel</div>

  <div class="card">
    <div id="lockMsg" class="lock"></div>
    
    <!-- Admin Key Modal (cantik, tak guna prompt sistem) -->
  <div id="keyModal" class="keymodal" style="display:none;">
    <div class="keybox">
      <div class="keytitle">Admin Verification</div>
      <div class="keysub">Masukkan Admin Key untuk akses panel.</div>

      <input id="keyInput" class="keyinput" type="password" placeholder="Admin Key" autocomplete="off" />

      <div class="keyrow">
        <button id="keyCancel" class="btn-secondary" type="button">Cancel</button>
        <button id="keyOk" class="btn-primary" type="button">Unlock</button>
      </div>

      <div id="keyErr" class="keyerr" style="display:none;"></div>
    </div>
  </div>

    <label>Phone Target</label>
    <input id="phone" placeholder="011xxxxxxxx">

    <label>Amount (RM)</label>
    <input id="amount" placeholder="10.00">

    <div class="row">
      <button class="btn-secondary" id="checkBtn">Check</button>
      <button class="btn-primary" id="addBtn">+ Add</button>
      <button class="btn-danger" id="subBtn">- Sub</button>
    </div>

    <div id="result" class="result">
      Balance: RM 0.00
    </div>
  </div>
</div>

<script src="auth.js"></script>

<script>
// ======= SET ADMIN PHONE =======
const ADMIN_PHONES = [
  "01139337462" // GANTI DENGAN NOMBOR ADMIN KAU
];

const ADMIN_KEY = "danz2026"; // tukar kalau nak

function normalize(p){
  return window.DSGAuth?.normalizePhone(p) || String(p||"").replace(/\D/g,"");
}

function isAdmin(){
  const s = window.DSGAuth?.getSession?.();
  if(!s?.phone) return false;
  return ADMIN_PHONES.map(normalize).includes(normalize(s.phone));
}

function lockPanel(msg){
  document.getElementById("lockMsg").style.display="block";
  document.getElementById("lockMsg").innerText=msg;
  ["phone","amount","checkBtn","addBtn","subBtn"]
    .forEach(id=>document.getElementById(id).disabled=true);
}

function unlockPanel(){
  document.getElementById("lockMsg").style.display="none";
  ["phone","amount","checkBtn","addBtn","subBtn"]
    .forEach(id=>document.getElementById(id).disabled=false);
}

function rm(n){return Number(n||0).toFixed(2)}

function showBalance(phone){
  const api = window.DSGAuth?.wallet;
  if(!api) return;
  const bal = api.getBalance(phone);
  document.getElementById("result").innerText =
    `Balance (${phone}): RM ${rm(bal)}`;
}

function applyGateWithDebug(){
  // tunggu DSGAuth ready (kadang mobile load lambat)
  if(!window.DSGAuth || !window.DSGAuth.getSession){
    setTimeout(applyGateWithDebug, 120);
    return;
  }
  
  function openKeyModal(){
  const modal = document.getElementById("keyModal");
  const input = document.getElementById("keyInput");
  const err   = document.getElementById("keyErr");

  modal.style.display = "flex";
  err.style.display = "none";
  err.innerText = "";
  input.value = "";
  setTimeout(()=>input.focus(), 50);

  const close = ()=>{
    modal.style.display = "none";
  };

  const submit = ()=>{
    const key = String(input.value || "");
    if(key !== ADMIN_KEY){
      err.style.display = "block";
      err.innerText = "❌ Admin Key salah.";
      input.focus();
      input.select();
      return;
    }
    sessionStorage.setItem("DSG_ADMIN_KEY_OK","1");
    close();
    // lepas unlock key, apply gate balik supaya unlock + enable + bind actions
    applyGateWithDebug();
  };

  document.getElementById("keyCancel").onclick = ()=>{
    close();
    // kekal lock kalau cancel
    lockPanel("❌ Admin Key diperlukan untuk akses panel.");
  };

  document.getElementById("keyOk").onclick = submit;

  input.onkeydown = (e)=>{
    if(e.key === "Enter") submit();
    if(e.key === "Escape") document.getElementById("keyCancel").click();
  };
}

  const s = window.DSGAuth.getSession();
  const sessionPhoneRaw = s?.phone || "";
  const sessionPhone = normalize(sessionPhoneRaw);

  const adminList = ADMIN_PHONES.map(normalize);

  // DEBUG supaya kita nampak apa compare sebenarnya
  if(!sessionPhone){
    lockPanel(`❌ Belum login.\n(session kosong)`);
    return;
  }

  if(!adminList.includes(sessionPhone)){
    lockPanel(
      `❌ Akses ditolak. Login guna nombor admin.\n` +
      `Session: ${sessionPhoneRaw} -> ${sessionPhone}\n` +
      `AdminList: ${adminList.join(", ")}`
    );
    return;
  }

  // optional key
  if(ADMIN_KEY){
  const ok = sessionStorage.getItem("DSG_ADMIN_KEY_OK");
  if(!ok){
    // lock dulu, then minta key pakai modal cantik
    lockPanel("🔒 Sila masukkan Admin Key untuk unlock panel.");
    openKeyModal();
    return; // stop sini, tunggu user masukkan key
  }
}

unlockPanel();
initActions();
}

document.addEventListener("DOMContentLoaded", ()=>{
  applyGateWithDebug();
});

// kalau login/logout berubah, auto check semula
window.addEventListener("dsg:auth-changed", applyGateWithDebug);

const phoneInput=document.getElementById("phone");
const amountInput=document.getElementById("amount");

let ACTIONS_BOUND = false;

function initActions(){
  if(ACTIONS_BOUND) return;
  ACTIONS_BOUND = true;

  document.getElementById("checkBtn").onclick = ()=>{
    const phone = normalize(phoneInput.value);
    if(!phone) return alert("Isi phone");
    showBalance(phone);
  };

  document.getElementById("addBtn").onclick = ()=>{
    const phone = normalize(phoneInput.value);
    const amt  = Number(amountInput.value || 0);
    if(!phone || amt<=0) return alert("Invalid");
    window.DSGAuth.wallet.addBalance(phone, amt);
    showBalance(phone);
  };

  document.getElementById("subBtn").onclick = ()=>{
    const phone = normalize(phoneInput.value);
    const amt  = Number(amountInput.value || 0);
    if(!phone || amt<=0) return alert("Invalid");
    const res = window.DSGAuth.wallet.deductBalance(phone, amt);
    if(!res.ok) return alert("Balance tak cukup");
    showBalance(phone);
  };
}

</script>
</body>
</html>
